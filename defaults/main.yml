# Credentials to interact with your bitcoind node
nbxplorer_rpc_username: bitcoin
# nbxplorer_rpc_password: hunter2

# set the refspec to "master" if you want rolling releases
nbxplorer_git_refspec: v2.6.0
# set the commit to "HEAD" if you want rolling releases
nbxplorer_git_commit: 05d8ed054e6436a3b43ecebb062e53f4a342f418

# The 2.5 line required .NET 8, the 2.6 line requires .NET 10
# feel free to use hax0rbana_adam.dotnetcore_sdk to get the version you want
nbxplorer_dotnet_version: 10

# By default, run this service with the same user/group as bitcoind
nbxplorer_user: bitcoin
nbxplorer_group: bitcoin

# Database settings
nbxplorer_db_name: nbxplorer
nbxplorer_db_user: nbxplorer
# You will need to supply your own password
# nbxplorer_db_pass: hunter2
